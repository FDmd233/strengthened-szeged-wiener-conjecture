name: Build and verify manuscript

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: szeged-verify-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  certificate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Detect first materialization
        id: materialize
        shell: bash
        run: |
          if [ -d source_parts ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruct manuscript source and fixed Atlas snapshots
        if: steps.materialize.outputs.needed == 'true'
        shell: bash
        run: |
          cat source_parts/texpart_* > Szeged_Wiener_2026-09-08.tex
          python -m pip install --disable-pip-version-check 'networkx==3.6.1'
          python certificate/export_atlas.py

      - name: Verify exact certificate
        shell: bash
        run: |
          chmod +x certificate/verify.sh
          certificate/verify.sh

      - name: Install TeX and archive tools
        if: steps.materialize.outputs.needed == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-xetex texlive-latex-extra texlive-fonts-recommended \
            texlive-lang-chinese fonts-noto-cjk zip

      - name: Build PDF and certificate archive
        if: steps.materialize.outputs.needed == 'true'
        shell: bash
        run: |
          make paper
          rm -f Szeged_Wiener_2026-09-08.aux \
                Szeged_Wiener_2026-09-08.bbl \
                Szeged_Wiener_2026-09-08.blg \
                Szeged_Wiener_2026-09-08.fdb_latexmk \
                Szeged_Wiener_2026-09-08.fls \
                Szeged_Wiener_2026-09-08.log \
                Szeged_Wiener_2026-09-08.out \
                Szeged_Wiener_2026-09-08.synctex.gz \
                Szeged_Wiener_2026-09-08.toc \
                Szeged_Wiener_2026-09-08.xdv
          rm -rf certificate/build
          rm -f Szeged_Wiener_Exact_Certificate_2026-09-08.zip
          zip -qr Szeged_Wiener_Exact_Certificate_2026-09-08.zip certificate \
            -x 'certificate/build/*'
          rm -rf source_parts
          find . -type f \
            ! -path './.git/*' \
            ! -path './certificate/build/*' \
            ! -name 'SHA256SUMS' \
            -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Commit materialized research package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.materialize.outputs.needed == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Materialize manuscript PDF and exact certificate'
            git push
          fi

  pdf_sync:
    name: Compile and synchronize published PDF
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    needs: certificate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Refresh main before packaging PDF
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Verify source/PDF checksum before rebuilding
        id: pdf_state
        shell: bash
        run: |
          if [ -s SOURCE_AND_PDF_SHA256SUMS ] && \
             sha256sum -c --status SOURCE_AND_PDF_SHA256SUMS && \
             test -s Szeged_Wiener_2026-09-08.pdf; then
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
            echo "Existing PDF matches the canonical TeX and recorded checksum."
          else
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install XeLaTeX
        if: steps.pdf_state.outputs.needs_build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-xetex texlive-latex-extra \
            texlive-fonts-recommended texlive-lang-chinese fonts-noto-cjk

      - name: Compile actual canonical TeX
        if: steps.pdf_state.outputs.needs_build == 'true'
        shell: bash
        run: |
          latexmk -xelatex -interaction=nonstopmode -halt-on-error \
            -file-line-error Szeged_Wiener_2026-09-08.tex
          test -s Szeged_Wiener_2026-09-08.pdf
          test "$(stat -c%s Szeged_Wiener_2026-09-08.pdf)" -gt 50000

      - name: Synchronize PDF and both SHA256 manifests
        shell: bash
        run: |
          set -euo pipefail
          sha256sum Szeged_Wiener_2026-09-08.tex Szeged_Wiener_2026-09-08.pdf \
            > SOURCE_AND_PDF_SHA256SUMS
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path
          names = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          paths = sorted(name.decode('utf-8') for name in names if name and name != b'SHA256SUMS')
          with Path('SHA256SUMS').open('w', encoding='utf-8') as fp:
              for path in paths:
                  digest = hashlib.sha256(Path(path).read_bytes()).hexdigest()
                  fp.write(f'{digest}  ./{path}\n')
          PY
          sha256sum -c SHA256SUMS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Szeged_Wiener_2026-09-08.pdf SOURCE_AND_PDF_SHA256SUMS SHA256SUMS
          if ! git diff --cached --quiet; then
            git commit -m 'Synchronize Szeged-Wiener PDF and checksum manifests'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Retain published PDF for page-by-page layout review
        uses: actions/upload-artifact@v4
        with:
          name: szeged-wiener-pdf-${{ github.sha }}
          path: Szeged_Wiener_2026-09-08.pdf
          if-no-files-found: error
          retention-days: 14
